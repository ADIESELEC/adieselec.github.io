name: Auto-generate weekly blog post

on:
  schedule:
    # Every Monday at 08:00 UTC (10:00 SAST)
    - cron: '0 8 * * 1'
  # Allows manually triggering a run from the Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  generate-blog-post:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate blog post
        env:
          # GITHUB_TOKEN is provided automatically by Actions. The
          # "models: read" permission above lets it call GitHub Models -
          # no separate account, API key, or billing needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_blog.py

      - name: Commit and push new blog post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/
          if git diff --cached --quiet; then
            echo "No new blog post generated, nothing to commit."
          else
            git commit -m "Auto-generate weekly blog post [skip ci]"
            git push
          fi
