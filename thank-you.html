<style>
  :root{
    --charcoal-black:#14120F;
    --charcoal:#201D1A;
    --charcoal-soft:#2B2723;
    --copper:#B87333;
    --copper-light:#D98B4A;
    --cream:#F6F0E4;
    --cream-dim:#DCD3C0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--charcoal-black);
    color:var(--cream);
    font-family:'Karla',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  .card{
    max-width:480px;
    background:var(--charcoal);
    border:1px solid rgba(217,139,74,0.25);
    border-radius:12px;
    padding:48px 32px;
  }
  .check{
    width:64px;height:64px;

    background:rgba(184,115,51,0.15);

  h1{
    font-family:'Oswald',sans-serif;
    font-size:1.8rem;
    font-weight:600;
    margin-bottom:12px;
    color:var(--cream);
  }
  p{
    color:var(--cream-dim);
    line-height:1.6;
    margin-bottom:28px;
  }
  .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .btn{
    display:inline-block;
    padding:12px 24px;
    border-radius:4px;
    font-weight:600;
    font-size:0.9rem;
    text-decoration:none;
    transition:background .2s;
  }
  .btn-primary{background:var(--copper);color:var(--charcoal-black);}
  .btn-primary:hover{background:var(--copper-light);}
  .btn-ghost{border:1px solid rgba(217,139,74,0.4);color:var(--cream);}
  .btn-ghost:hover{background:var(--charcoal-soft);}
